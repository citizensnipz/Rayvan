[package]
name = "rayvan"
version = "0.1.0"
description = "A foundation for the Rayvan decentralized AI inference node"
authors = ["Rayvan contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rayvan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
